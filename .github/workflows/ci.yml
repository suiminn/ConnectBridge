name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-ios --no-self-update && rustup default stable

      - name: Lint plists and scripts
        run: |
          find . -name '*.plist' -not -path './build/*' -not -path './.theos/*' -print0 | xargs -0 plutil -lint
          for script in scripts/*.sh layout/DEBIAN/postinst layout/DEBIAN/prerm layout/DEBIAN/postrm; do bash -n "$script"; done

      - name: Host tests
        run: scripts/test-daemon.sh

      - uses: ./.github/actions/build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connectbridge-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
