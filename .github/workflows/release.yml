name: Release

# Push a tag to publish: v0.1.0 for a release, v0.1.0-beta1 for a pre-release.
# The tag must match layout/DEBIAN/control: a "-" in the tag is a "~" in the package version
# (v0.1.0-beta1 <-> 0.1.0~beta1), so that the final 0.1.0 upgrades the beta.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write      # for the build attestation
  attestations: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag against the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          expected="${version/-/~}"
          actual="$(sed -n 's/^Version: //p' layout/DEBIAN/control)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::tag $TAG expects Version: $expected, but layout/DEBIAN/control has $actual"
            exit 1
          fi

      - name: Host tests
        run: scripts/test-daemon.sh

      - uses: ./.github/actions/build

      # SHA256SUMS sits next to the deb, so it only detects a damaged download. The attestation ties
      # the deb to this workflow run: gh attestation verify <deb> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/*.deb

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd packages
          shasum -a 256 *.deb > SHA256SUMS
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" *.deb SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
